<!doctype html>
<html lang="en" class="h-full antialiased dark" data-theme="coffee">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Kālai — Ceramic Artist Task & Studio Manager</title>

		<!-- Inline theme initialization to prevent FOUT (Flash of Unstyled Content) -->
		<script>
			(function() {
				try {
					var theme = localStorage.getItem('theme') || 'coffee';
					if (theme === 'light') theme = 'retro';
					if (theme === 'dark') theme = 'coffee';
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var targetTheme = theme;
					if (theme === 'system') {
						targetTheme = prefersDark ? 'coffee' : 'retro';
					}
					document.documentElement.setAttribute('data-theme', targetTheme);
					if (targetTheme === 'coffee') {
						document.documentElement.classList.add('dark');
					} else {
						document.documentElement.classList.remove('dark');
					}
				} catch (e) {}
			})();
		</script>

		<!-- Typography: Plus Jakarta Sans (body) & Outfit (headers) -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full font-sans antialiased bg-base-200 text-base-content transition-colors duration-200">
		<div style="display: contents" class="h-full">%sveltekit.body%</div>
	</body>
</html>
