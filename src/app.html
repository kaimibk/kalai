<!doctype html>
<html lang="en" class="h-full antialiased dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Kālai — Ceramic Artist Task & Studio Manager</title>

		<!-- Inline theme initialization to prevent FOUT (Flash of Unstyled Content) -->
		<script>
			(function() {
				try {
					var theme = localStorage.getItem('theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					if (theme === 'dark' || (!theme && prefersDark) || (theme === 'system' && prefersDark)) {
						document.documentElement.classList.add('dark');
					} else if (theme === 'light') {
						document.documentElement.classList.remove('dark');
					} else {
						document.documentElement.classList.add('dark');
					}
				} catch (e) {}
			})();
		</script>

		<!-- Typography: Plus Jakarta Sans (body) & Outfit (headers) -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full font-sans antialiased bg-[#F7F4EF] text-stone-800 dark:bg-[#181616] dark:text-[#F4F1DE] transition-colors duration-200 selection:bg-[#E07A5F] selection:text-white">
		<div style="display: contents" class="h-full">%sveltekit.body%</div>
	</body>
</html>
